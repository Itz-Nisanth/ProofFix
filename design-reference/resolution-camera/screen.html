<img alt="Live camera view of clean tree-lined street in Anna Nagar Chennai" class="absolute inset-0 w-full h-full object-cover z-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJVqY_rjauWkWHvJ3ZZph0XPneFBRdenSo8eFOOZdGM302a1CA0ctIzM-lfIb8XIg6Na-xQmv-w_EBdHVAE2kmqiGG9ITKQ-yr5Z1NJz2v2E9PJcAC2BzCZihrNBO5lBS4k2eEyzK-ly3hCA6ZVeXPSqCJTL3IjVohJ7Tx4A0uTGlDNR_X1Sip2PbSPHMdOjnBwQVcgz6o_lNCr7GcmBEtj6tBGazqYH3w_TtauS_1ILdD3Qylae9dLQ"/>
<!-- Ambient Scrim Gradients -->
<div class="absolute inset-x-0 top-0 h-36 bg-gradient-to-b from-primary/70 via-primary/25 to-transparent z-10 pointer-events-none"></div>
<div class="absolute inset-x-0 bottom-0 h-44 bg-gradient-to-t from-primary/80 via-primary/30 to-transparent z-10 pointer-events-none"></div>
<!-- Viewfinder Reticle Framing Guide -->
<div class="absolute inset-6 sm:inset-10 rounded-2xl pointer-events-none z-10 flex flex-col justify-between">
<div class="flex justify-between items-start">
<div class="w-6 h-6 border-t-2 border-l-2 border-white/60 rounded-tl-lg"></div>
<div class="w-6 h-6 border-t-2 border-r-2 border-white/60 rounded-tr-lg"></div>
</div>
<div class="flex justify-between items-end">
<div class="w-6 h-6 border-b-2 border-l-2 border-white/60 rounded-bl-lg"></div>
<div class="w-6 h-6 border-b-2 border-r-2 border-white/60 rounded-br-lg"></div>
</div>
</div>
<!-- Top Overlay Controls -->
<div class="relative z-20 px-space-md pt-space-md flex flex-col gap-space-sm items-center">
<!-- Top Navigation & Live Verification Pill -->
<div class="w-full flex items-center justify-between">
<button aria-label="Cancel capture" class="w-11 h-11 rounded-full bg-primary/40 backdrop-blur-md flex items-center justify-center text-white active:scale-95 transition-transform" onclick="history.back()">
<span class="material-symbols-outlined text-[22px]">close</span>
</button>
<!-- Location Verified Subtle Pill -->
<div class="flex items-center gap-space-xs px-3.5 py-1.5 rounded-full bg-primary/60 backdrop-blur-md shadow-sm">
<span class="w-2 h-2 rounded-full bg-primary-fixed animate-pulse"></span>
<span class="font-label-sm text-label-sm text-white tracking-wide">Location verified</span>
</div>
<button aria-label="Toggle camera assistant" class="w-11 h-11 rounded-full bg-primary/40 backdrop-blur-md flex items-center justify-center text-white active:scale-95 transition-transform" id="flash-toggle-btn" onclick="toggleFlashHint()">
<span class="material-symbols-outlined text-[20px]" id="flash-icon">lightbulb</span>
</button>
</div>
<!-- Instruction Guidance Pill -->
<div class="mt-1 px-4 py-2 rounded-full bg-surface-card/95 backdrop-blur-md shadow-md text-center max-w-[85%] transition-all duration-300">
<p class="font-label-md text-label-md text-on-surface font-medium flex items-center justify-center gap-1.5">
<span class="material-symbols-outlined text-state-resolved text-[18px]">verified</span>
          Show the area after the issue has been addressed.
        </p>
</div>
<!-- Quick Comparison Drawer Anchor -->
<div class="relative mt-1">
<button aria-expanded="false" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-card/80 hover:bg-surface-card backdrop-blur-md shadow-sm transition-all active:scale-95" id="compare-toggle-btn" onclick="toggleEvidencePreview()">
<div class="w-5 h-5 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-[13px]">history</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium">Original: Fallen tree across lane</span>
<span class="material-symbols-outlined text-on-surface-variant text-[16px] transition-transform duration-200" id="compare-arrow">expand_more</span>
</button>
<!-- Collapsible Mini Evidence Thumbnail Preview -->
<div class="hidden absolute left-1/2 -translate-x-1/2 top-full mt-2 w-64 p-2.5 rounded-2xl bg-surface-card shadow-xl flex items-center gap-3 z-30 transition-all duration-200" id="evidence-card">
<img class="w-12 h-12 rounded-xl object-cover flex-shrink-0 shadow-sm" data-alt="A large tropical banyan tree branch fallen completely across a residential paved street in Anna Nagar Chennai, blocking road access, snapped power line nearby, daytime overcast light." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCJVKPKJI5s4U7fU5AcVtPszX9Pad03Kz-0jXWOhS5P6cHOwcP9stkeWvFtm6yVp7DMF_JY4DVbxKzMqSFsRqoOs2iiIckAioxa1pSmbfbKIGkZIus2oUYcEd3Hgwnsk8EtrTLvfeJLINSBXRqNVa4pt5q0ov3XWf6g_sk05BwYjTLM8Xkq7vmpt5Tyk7i_fhf9RfvAzSqEtU7WMI7P9z5TBfNQrDdet6WQjOS73yWNvOVOZcBPTfKfjg"/>
<div class="flex flex-col min-w-0">
<span class="font-label-sm text-label-sm font-semibold text-on-surface truncate">Original Incident</span>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Reported 2h ago</span>
<span class="font-label-sm text-label-sm text-secondary font-medium mt-0.5">Clearing required</span>
</div>
</div>
</div>
</div>
<!-- Bottom Center Shutter Hub -->
<div class="relative z-20 pb-space-lg px-space-md flex flex-col items-center gap-space-sm">
<!-- Primary Shutter Interaction -->
<div class="relative flex items-center justify-center">
<!-- Shutter Outer Ring -->
<div class="w-[84px] h-[84px] rounded-full bg-white/30 backdrop-blur-sm p-1.5 flex items-center justify-center shadow-lg">
<!-- Actual Trigger Button -->
<button aria-label="Capture resolution photo" class="w-full h-full rounded-full bg-primary-container hover:bg-primary text-white flex items-center justify-center shadow-md active:scale-90 transition-transform duration-150 focus:outline-none" id="shutter-button" onclick="triggerCaptureSequence(this)">
<span class="material-symbols-outlined text-[30px] text-primary-fixed">photo_camera</span>
</button>
</div>
</div>
<!-- Human-First Authenticity Footnote -->
<div class="flex items-center gap-1.5 text-center">
<span class="w-1.5 h-1.5 rounded-full bg-primary-fixed-dim"></span>
<p class="font-label-sm text-label-sm text-white/90 font-medium tracking-wide">
          Live capture only • Anna Nagar, Chennai
        </p>
</div>
</div>
</div>
<!-- Resolution Confirmation Micro-Sheet (Hidden until captured) -->
<div class="hidden mt-space-md p-space-md rounded-2xl bg-surface-card shadow-lg flex flex-col gap-space-sm transition-all duration-300" id="capture-confirmation-panel">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-state-resolved-subtle text-state-resolved flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">task_alt</span>
</div>
<div>
<h2 class="font-headline-sm text-headline-sm text-on-surface leading-tight">Lane clear &amp; restored</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Ready to submit community verification</p>
</div>
</div>
<button class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface underline p-1" onclick="resetCapture()">
        Retake
      </button>
</div>
<button class="w-full h-14 rounded-full bg-primary-container text-white font-label-lg text-label-lg font-semibold flex items-center justify-center gap-2 shadow-md active:scale-[0.98] transition-all" onclick="completeSubmission(this)">
<span>Submit Proof of Resolution</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
<script>
  let isComparedOpen = false;

  function toggleEvidencePreview() {
    const card = document.getElementById('evidence-card');
    const arrow = document.getElementById('compare-arrow');
    const btn = document.getElementById('compare-toggle-btn');
    
    isComparedOpen = !isComparedOpen;
    if (isComparedOpen) {
      card.classList.remove('hidden');
      arrow.classList.add('rotate-180');
      btn.setAttribute('aria-expanded', 'true');
    } else {
      card.classList.add('hidden');
      arrow.classList.remove('rotate-180');
      btn.setAttribute('aria-expanded', 'false');
    }
  }

  function toggleFlashHint() {
    const icon = document.getElementById('flash-icon');
    if (icon.innerText === 'lightbulb') {
      icon.innerText = 'lightbulb_circle';
      icon.classList.add('text-secondary-container');
    } else {
      icon.innerText = 'lightbulb';
      icon.classList.remove('text-secondary-container');
    }
  }

  function triggerCaptureSequence(btn) {
    btn.classList.add('scale-75');
    setTimeout(() => {
      btn.classList.remove('scale-75');
      const panel = document.getElementById('capture-confirmation-panel');
      panel.classList.remove('hidden');
      panel.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }, 200);
  }

  function resetCapture() {
    const panel = document.getElementById('capture-confirmation-panel');
    panel.classList.add('hidden');
  }

  function completeSubmission(button) {
    button.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Verifying proof...</span>';
    setTimeout(() => {
      button.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span>Resolution recorded!</span>';
      button.classList.remove('bg-primary-container');
      button.classList.add('bg-state-resolved');
    }, 900);
  }
</script></main></body></html>
