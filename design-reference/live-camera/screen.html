"lineHeight": "40px", "letterSpacing": "-0.025em", "fontWeight": "700" }], "headline-lg-mobile": ["26px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }] } } } };</script><style>@layer base { html, body { width: 100vw; margin: 0; padding: 0; } body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-surface text-on-surface antialiased selection:bg-primary-fixed selection:text-on-primary-fixed"><header class="fixed top-0 inset-x-0 z-50 pt-safe bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.03)]"><div class="h-16 px-space-sm flex items-center justify-between max-w-max-content-width mx-auto"><div class="flex items-center gap-space-xs"><button aria-label="Go Back" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[22px]">arrow_back</span></button><img alt="ProofFix Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1VVvsRQizMnAEN56JjdvnBlXYujKgr4IZzFTim4x8mH23PaCx0GfkoheCEsp7faqAQ9AkEFoCl1JpAbv4ZlKVmT3FsNBv_WE_YS3I7Y9sgN9dPR963hEF7pjCdhdHEW_JWxuZcDa-ymZiggTwhap1kTTEFX8xcBFQ0ZpSvJ3v2OYHMdjak6JEiiN6eV_w70uWj7m633PAq654htDQqsCMjy1wiK2avSZ9jgySKEGkTlSukofxQ0_89j1GU"><h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight ml-space-xxs line-clamp-1">Live Camera Report</h1></div><div class="flex items-center gap-space-xs"><img alt="Profile" class="w-8 h-8 rounded-full object-cover shadow-[0_2px_6px_rgba(25,28,27,0.1)] ring-1 ring-surface-variant/40" src="https://lh3.googleusercontent.com/aida-p <!-- Immersive Live Viewfinder Container -->

<!-- Camera Viewport Layer -->
<div class="absolute inset-0 z-0">
<img alt="Live viewfinder stream showing fallen tree blocking street" class="w-full h-full object-cover transform scale-105 transition-transform duration-700 ease-out" id="cameraFeed" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB6RciTw1zfrU0TgpVBXSh6zXO994c05o-Wti1iWOSCrGKXuF1QkcROv5ak0QhAv0ujoi0QnMX7HQ19bC1IpK1Gr7gg9_EKjlIGiswUcjWit7U6JY7xVEnzbTgJ00ROa5IZql2yHWT0ivsc5BiW6xOytWR9eFuv_Lv2Xijoj7w71IDgLLRY-g_AiBPiKOCh4GpXNuiUuwgeUqrauu4j3TfNgMT2b0GP_04tcEEaKrM3sXr_soacL-SHCg">
<!-- Ambient Optical Vignette & Scrims -->
<div class="absolute inset-x-0 top-0 h-40 bg-gradient-to-b from-black/80 via-black/35 to-transparent pointer-events-none"></div>
<div class="absolute inset-x-0 bottom-0 h-64 bg-gradient-to-t from-black/90 via-black/40 to-transparent pointer-events-none"></div>
</div>
<!-- Interactive AI Detection Reticle / Civic Framing Bounding Box -->

<!-- Top Overlay Bar (Controls & Geotag Status) -->
<div class="relative z-20 w-full pt-space-md px-margin-mobile flex flex-col items-center gap-space-sm">
<div class="w-full flex items-center justify-between">
<!-- Dismiss / Return -->
<button aria-label="Close Camera" class="w-11 h-11 rounded-full bg-black/40 active:bg-black/60 backdrop-blur-md text-surface-container-lowest flex items-center justify-center transition-all transform active:scale-95 touch-manipulation" onclick="history.back()">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<!-- Dynamic GPS Telemetry Pill -->
<div class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-black/50 backdrop-blur-md text-surface-container-lowest shadow-sm"><span class="w-2 h-2 rounded-full bg-primary-fixed shadow-[0_0_8px_#b0f1c7]"></span><span class="font-label-md text-label-md tracking-tight text-surface-container-lowest font-medium">Location verified</span></div>
<!-- Flash Toggle Control -->
<button aria-label="Toggle Flash Mode" class="w-11 h-11 rounded-full bg-black/40 active:bg-black/60 backdrop-blur-md text-surface-container-lowest flex items-center justify-center transition-all transform active:scale-95 touch-manipulation" id="flashToggle" onclick="toggleFlashState()">
<span class="material-symbols-outlined text-[22px]" id="flashIcon">flash_off</span>
</button>
</div>
<!-- Live Mesh Distance Gauge -->

</div>
<!-- Bottom HUD & Shutter Trigger (Golden Thumb Zone) -->
<div class="relative z-20 w-full pb-8 pt-space-md px-margin-mobile flex flex-col items-center">
<!-- Tactile Natural Guidance Banner -->
<div class="mb-5 transition-all duration-300 transform" id="guidanceBanner">
<div class="px-4 py-1.5 rounded-full bg-black/55 backdrop-blur-md text-surface-container-lowest flex items-center gap-2 shadow-lg"><span class="material-symbols-outlined text-[16px] text-primary-fixed">center_focus_strong</span><span class="font-label-md text-label-md font-medium">Keep the issue clearly visible</span></div>
</div>
<!-- Primary Camera Controller Deck -->
<div class="w-full flex items-center justify-around max-w-xs">
<!-- Spatial Grid Toggle Button -->
<button aria-label="Toggle Composition Grid" class="w-12 h-12 rounded-full bg-black/30 active:bg-black/50 backdrop-blur-md text-surface-container-lowest/80 flex items-center justify-center transition-all active:scale-90" id="gridBtn" onclick="toggleGrid()">
<span class="material-symbols-outlined text-[20px]" id="gridIcon">grid_4x4</span>
</button>
<!-- Restorative Shutter Action Button -->
<div class="relative flex items-center justify-center">
<!-- Outer Pulsing Glow -->
<div class="absolute -inset-2 rounded-full bg-primary-fixed/20 blur-md opacity-60 animate-pulse pointer-events-none"></div>
<!-- Physical Dual-Ring Shutter -->
<button aria-label="Capture Incident Photo" class="relative w-20 h-20 rounded-full bg-surface-container-lowest p-1.5 shadow-[0_8px_28px_rgba(0,0,0,0.4)] transition-all duration-150 transform active:scale-90 focus:outline-none" id="shutterBtn" onclick="triggerCaptureSequence()">
<div class="w-full h-full rounded-full bg-primary-container active:bg-primary flex items-center justify-center shadow-inner transition-colors">
<span class="material-symbols-outlined text-primary-fixed text-[28px] transition-transform duration-200" id="shutterIcon">photo_camera</span>
</div>
</button>
</div>
<!-- Level Indicator Aid -->
<div class="w-12 h-12 rounded-full bg-black/30 backdrop-blur-md text-primary-fixed flex items-center justify-center transition-all" id="levelIndicator" title="Surface Level Horizon">
<span class="material-symbols-outlined text-[20px]">screen_rotation</span>
</div>
</div>
<!-- Quick Reassurance Footer Note -->
<div class="mt-4 flex items-center gap-1.5 text-surface-container-lowest/60 font-label-sm text-label-sm"><span class="material-symbols-outlined text-[14px]">videocam</span><span class="">Live capture only</span></div>
</div>
<!-- Simulated Capture Flash Screen Overlay -->
<div class="absolute inset-0 bg-surface-container-lowest opacity-0 pointer-events-none z-50 transition-opacity duration-150" id="flashFx"></div>
<!-- On-Capture Progressive Status Sheet (Slide-Up Feedback) -->
<div class="absolute inset-x-0 bottom-0 z-40 bg-surface-card rounded-t-3xl p-margin-mobile shadow-[0_-12px_40px_rgba(0,0,0,0.3)] translate-y-full transition-transform duration-300 ease-out flex flex-col gap-space-sm text-on-surface" id="analysisSheet">
<div class="w-10 h-1.5 rounded-full bg-surface-variant mx-auto mb-1"></div>
<div class="flex items-start justify-between">
<div>
<span class="font-label-sm text-label-sm text-primary font-bold tracking-wide uppercase">Proof Captured</span>
<h2 class="font-headline-sm text-headline-sm text-on-surface mt-0.5">Assessing Community Impact</h2>
</div>
<div class="w-8 h-8 rounded-full bg-state-resolved-subtle text-state-resolved flex items-center justify-center">
<span class="material-symbols-outlined text-[18px]">done_all</span>
</div>
</div>
<div class="space-y-2 py-1">
<div class="flex items-center gap-2.5 text-on-surface-variant font-body-md text-body-md">
<span class="material-symbols-outlined text-primary text-[18px]">verified</span>
<span class="">Camera telemetry &amp; GPS authenticated</span>
</div>
<div class="flex items-center gap-2.5 text-on-surface-variant font-body-md text-body-md">
<span class="material-symbols-outlined text-secondary text-[18px]">warning</span>
<span class="">Fallen tree blocking arterial road access</span>
</div>
</div>
<div class="pt-2 flex gap-space-xs">
<button class="flex-1 py-3.5 px-4 rounded-xl bg-surface-container-high text-on-surface font-label-lg text-label-lg active:bg-surface-variant transition-colors" onclick="dismissSheet()">
          Retake
        </button>
<button class="flex-[2] py-3.5 px-4 rounded-xl bg-primary text-on-primary font-label-lg text-label-lg shadow-md active:bg-primary-container transition-all flex items-center justify-center gap-2" onclick="confirmIncident()">
<span class="">Confirm Hazard</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</div>
</div>
<script>
  let flashState = false;
  let gridActive = true;

  function toggleFlashState() {
    flashState = !flashState;
    const icon = document.getElementById('flashIcon');
    const btn = document.getElementById('flashToggle');
    if (flashState) {
      icon.textContent = 'flash_on';
      btn.classList.add('bg-primary-container', 'text-primary-fixed');
      btn.classList.remove('bg-black/40', 'text-surface-container-lowest');
    } else {
      icon.textContent = 'flash_off';
      btn.classList.remove('bg-primary-container', 'text-primary-fixed');
      btn.classList.add('bg-black/40', 'text-surface-container-lowest');
    }
  }

  function toggleGrid() {
    gridActive = !gridActive;
    const reticle = document.getElementById('detectionFrame');
    const icon = document.getElementById('gridIcon');
    if (gridActive) {
      reticle.classList.remove('opacity-0');
      icon.classList.remove('text-outline');
    } else {
      reticle.classList.add('opacity-0');
      icon.classList.add('text-outline');
    }
  }

  function triggerCaptureSequence() {
    const flashEl = document.getElementById('flashFx');
    const feed = document.getElementById('cameraFeed');
    const shutterBtn = document.getElementById('shutterBtn');
    const sheet = document.getElementById('analysisSheet');

    // Visual Haptic Flash
    flashEl.classList.remove('opacity-0');
    flashEl.classList.add('opacity-85');
    shutterBtn.classList.add('scale-90');

    setTimeout(() => {
      flashEl.classList.remove('opacity-85');
      flashEl.classList.add('opacity-0');
      shutterBtn.classList.remove('scale-90');
      feed.classList.add('filter', 'brightness-95', 'contrast-105');
    }, 120);

    // Reveal Progressive Confirmation Sheet
    setTimeout(() => {
      sheet.classList.remove('translate-y-full');
      sheet.classList.add('translate-y-0');
    }, 280);
  }

  function dismissSheet() {
    const sheet = document.getElementById('analysisSheet');
    const feed = document.getElementById('cameraFeed');
    sheet.classList.remove('translate-y-0');
    sheet.classList.add('translate-y-full');
    feed.classList.remove('filter', 'brightness-95', 'contrast-105');
  }

  function confirmIncident() {
    const confirmBtn = event.currentTarget;
    confirmBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span><span>Publishing to Neighbors...</span>';
    setTimeout(() => {
      confirmBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span>Report Dispatched</span>';
      confirmBtn.classList.remove('bg-primary');
      confirmBtn.classList.add('bg-state-resolved');
    }, 850);
  }
</script></main>

</body></html>
